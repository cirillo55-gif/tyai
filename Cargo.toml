[package]
name = "tyai_system"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
memmap2 = "0.9"
rayon = "1.10"


[[bin]]
name = "gen_dataset"
path = "src/bin/gen_dataset.rs"

[[bin]]
name = "trainer"
path = "src/bin/trainer.rs"

[[bin]]
name = "packer"
path = "src/bin/packer.rs"

[[bin]]
name = "tyai_run"
path = "src/bin/tyai_run.rs"




[lib]
name = "tyai_system"
path = "src/lib.rs"
